<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Missile Command</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; }
canvas { display:block; cursor:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// --- CANVAS SIZING ---
const W = 800, H = 600;
canvas.width  = W;
canvas.height = H;
// Scale to fit window while keeping aspect ratio
function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
window.addEventListener('resize', resize);
resize();

// --- CONSTANTS ---
const GROUND_Y   = 555;
const BAT_X      = [100, 400, 700];   // battery X positions
const CITY_X     = [168, 246, 324, 476, 554, 632]; // city X positions
const AMMO_MAX   = 10;
const EXPL_GROW  = 1.8;   // px per frame
const EXPL_SHRK  = 1.1;
const EXPL_R     = 42;    // max radius
const CITY_HIT_R = 28;
const BAT_HIT_R  = 20;

// Wave scoring table
const WAVE_PTS = [25, 25, 50, 50, 75, 75, 100, 100, 125, 125];
const waveScore = w => WAVE_PTS[Math.min(w - 1, WAVE_PTS.length - 1)];

// Wave missile colors
const WAVE_COLS = ['#fff','#ff0','#0ff','#f90','#f0f','#8f8','#f44','#8af','#fa8'];
const waveCol   = w => WAVE_COLS[(w - 1) % WAVE_COLS.length];

// --- AUDIO ---
const AC = new (window.AudioContext || window.webkitAudioContext)();

function beep(freq, dur, type = 'sine', vol = 0.25, delay = 0) {
  try {
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type = type; o.frequency.value = freq;
    const t = AC.currentTime + delay;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.05);
  } catch(e) {}
}

function sfxNoise(dur = 0.18, vol = 0.35) {
  try {
    const n = Math.floor(AC.sampleRate * dur);
    const buf = AC.createBuffer(1, n, AC.sampleRate);
    const d   = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource();
    const g   = AC.createGain();
    src.buffer = buf; src.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    src.start(); src.stop(AC.currentTime + dur + 0.05);
  } catch(e) {}
}

function sfxFire(bi) {
  const freqs = [294, 392, 523]; // D4, G4, C5 — one per battery
  beep(freqs[bi], 0.1, 'square', 0.18);
}
function sfxExplode()  { sfxNoise(0.18, 0.3); beep(100, 0.12, 'sawtooth', 0.15); }
function sfxCityDie()  { [440,330,220].forEach((f,i) => beep(f, 0.2, 'square', 0.4, i*0.1)); }
function sfxWaveClear(){ [330,440,550,660,880].forEach((f,i) => beep(f, 0.14, 'sine', 0.25, i*0.1)); }
function sfxGameOver() { [440,330,220,165,110].forEach((f,i) => beep(f, 0.28, 'square', 0.45, i*0.22)); }
function sfxExtraCity(){ [523,659,784,1047].forEach((f,i) => beep(f, 0.12, 'sine', 0.3, i*0.08)); }

// --- GAME STATE ---
let state;       // 'TITLE' | 'PLAYING' | 'BONUS' | 'OVER'
let score, hiScore, wave;
let cities, batteries, missiles, interceptors, explosions, bombers;
let missilePool, spawned, spawnTimer;
let bonusPhase, bonusTimer, bonusCities, bonusMissiles, bonusDisplay;
let nextCityScore;
let mx = W/2, my = H/2;

hiScore = parseInt(localStorage.getItem('mc_hi') || '0');

// --- INIT ---
function initGame() {
  score        = 0;
  wave         = 1;
  nextCityScore = 10000;
  cities     = CITY_X.map(x => ({ x, alive: true  }));
  batteries  = BAT_X .map(x => ({ x, alive: true, ammo: AMMO_MAX }));
  initWave();
}

function initWave() {
  missiles     = [];
  interceptors = [];
  explosions   = [];
  bombers      = [];
  spawned      = 0;
  spawnTimer   = 80; // frames before first missile
  missilePool  = Math.min(10 + (wave - 1) * 3, 40);
  // Refill living batteries
  batteries.forEach(b => { if (b.alive) b.ammo = AMMO_MAX; });
}

// --- SPAWN HELPERS ---
function livingTargets() {
  const t = [];
  cities   .filter(c => c.alive).forEach(c => t.push({ x: c.x,  y: GROUND_Y }));
  batteries.filter(b => b.alive).forEach(b => t.push({ x: b.x,  y: GROUND_Y }));
  if (t.length === 0) t.push({ x: W / 2, y: GROUND_Y });
  return t;
}

function makeMissile(sx, sy, tx, ty, mirv) {
  const spd  = (0.7 + (wave - 1) * 0.13) * (0.85 + Math.random() * 0.3);
  const dx   = tx - sx, dy = ty - sy;
  const dist = Math.hypot(dx, dy) || 1;
  return {
    x: sx, y: sy, tx, ty,
    vx: dx / dist * spd,
    vy: dy / dist * spd,
    trail: [[sx, sy]],
    alive: true,
    mirv,
    splitY: 120 + Math.random() * 180,
    col: waveCol(wave)
  };
}

function spawnMissile() {
  const targets = livingTargets();
  const tgt = targets[Math.floor(Math.random() * targets.length)];
  tgt.x += (Math.random() - 0.5) * 50;
  const isMirv = wave >= 5 && Math.random() < 0.22;
  missiles.push(makeMissile(Math.random() * W, 0, tgt.x, tgt.y, isMirv));
}

function splitMirv(m) {
  const count = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < count; i++) {
    const tx = Math.random() * W;
    missiles.push(makeMissile(m.x, m.y, tx, GROUND_Y, false));
  }
}

function spawnBomber() {
  const left = Math.random() < 0.5;
  bombers.push({
    x: left ? -40 : W + 40,
    y: 50 + Math.random() * 100,
    vx: left ? 1.8 : -1.8,
    dropTimer: 50 + Math.random() * 30,
    alive: true,
    col: waveCol(wave)
  });
}

function addExplosion(x, y, maxR, player) {
  explosions.push({ x, y, r: 3, maxR, growing: true, alive: true, player });
  sfxExplode();
}

// --- FIRE ---
function fire(bi, tx, ty) {
  const b = batteries[bi];
  if (!b || !b.alive || b.ammo <= 0) return;
  b.ammo--;
  const spd = 6;
  const dx  = tx - b.x, dy = ty - (GROUND_Y - 16);
  const dist = Math.hypot(dx, dy) || 1;
  interceptors.push({
    x: b.x, y: GROUND_Y - 16,
    tx, ty,
    vx: dx / dist * spd,
    vy: dy / dist * spd,
    trail: [[b.x, GROUND_Y - 16]],
    alive: true
  });
  sfxFire(bi);
}

// --- GROUND HIT ---
function groundHit(x) {
  for (const c of cities) {
    if (c.alive && Math.abs(c.x - x) < CITY_HIT_R) {
      c.alive = false;
      sfxCityDie();
      addExplosion(c.x, GROUND_Y - 15, 50, false);
      return;
    }
  }
  for (const b of batteries) {
    if (b.alive && Math.abs(b.x - x) < BAT_HIT_R) {
      b.alive = false;
      addExplosion(b.x, GROUND_Y - 10, 40, false);
    }
  }
}

// --- SCORE HELPER ---
function addScore(pts) {
  score += pts;
  if (score > hiScore) {
    hiScore = score;
    localStorage.setItem('mc_hi', hiScore);
  }
  // Extra city at score thresholds
  while (score >= nextCityScore) {
    nextCityScore += 10000;
    const dead = cities.find(c => !c.alive);
    if (dead) { dead.alive = true; sfxExtraCity(); }
  }
}

// --- UPDATE ---
function update(dt) {
  // Missile spawning
  spawnTimer -= dt;
  if (spawnTimer <= 0 && spawned < missilePool) {
    const interval = Math.max(35, 140 - wave * 10);
    spawnTimer = interval;
    if (wave >= 3 && spawned % 7 === 0 && Math.random() < 0.35) spawnBomber();
    spawnMissile();
    spawned++;
  }

  // Enemy missiles
  const newMissiles = [];
  for (const m of missiles) {
    if (!m.alive) continue;
    m.x += m.vx * dt; m.y += m.vy * dt;
    m.trail.push([m.x, m.y]);
    if (m.trail.length > 90) m.trail.shift();
    // MIRV split
    if (m.mirv && m.y >= m.splitY) {
      m.alive = false;
      // Collect child missiles to add after loop
      const count = 3 + Math.floor(Math.random() * 3);
      for (let i = 0; i < count; i++) {
        newMissiles.push(makeMissile(m.x, m.y, Math.random() * W, GROUND_Y, false));
      }
      continue;
    }
    if (m.y >= GROUND_Y) { m.alive = false; groundHit(m.x); }
  }
  for (const m of newMissiles) missiles.push(m);

  // Bombers
  const newBomberMissiles = [];
  for (const b of bombers) {
    if (!b.alive) continue;
    b.x += b.vx * dt;
    b.dropTimer -= dt;
    if (b.dropTimer <= 0) {
      b.dropTimer = 60 + Math.random() * 40;
      const tgts = livingTargets();
      const tgt  = tgts[Math.floor(Math.random() * tgts.length)];
      newBomberMissiles.push(makeMissile(b.x, b.y, tgt.x + (Math.random()-0.5)*40, GROUND_Y, false));
    }
    if (b.x < -60 || b.x > W + 60) b.alive = false;
  }
  for (const m of newBomberMissiles) missiles.push(m);

  // Interceptors
  for (const ic of interceptors) {
    if (!ic.alive) continue;
    ic.x += ic.vx * dt; ic.y += ic.vy * dt;
    ic.trail.push([ic.x, ic.y]);
    if (ic.trail.length > 45) ic.trail.shift();
    // Reached target?
    if (Math.hypot(ic.tx - ic.x, ic.ty - ic.y) < 8) {
      ic.alive = false;
      addExplosion(ic.tx, ic.ty, EXPL_R, true);
    }
  }

  // Explosions + collision detection
  for (const ex of explosions) {
    if (!ex.alive) continue;
    if (ex.growing) {
      ex.r += EXPL_GROW * dt;
      if (ex.r >= ex.maxR) ex.growing = false;
    } else {
      ex.r -= EXPL_SHRK * dt;
      if (ex.r <= 0) { ex.alive = false; continue; }
    }
    if (!ex.player) continue;
    // Check missiles
    for (const m of missiles) {
      if (!m.alive) continue;
      if (Math.hypot(m.x - ex.x, m.y - ex.y) <= ex.r) {
        m.alive = false;
        addScore(waveScore(wave));
        // Small chain explosion
        addExplosion(m.x, m.y, EXPL_R * 0.85, true);
      }
    }
    // Check bombers
    for (const b of bombers) {
      if (!b.alive) continue;
      if (Math.hypot(b.x - ex.x, b.y - ex.y) <= ex.r) {
        b.alive = false;
        addScore(waveScore(wave) * 3);
        addExplosion(b.x, b.y, EXPL_R * 1.2, true);
      }
    }
  }

  // Cleanup dead objects
  missiles     = missiles    .filter(m => m.alive);
  interceptors = interceptors.filter(i => i.alive);
  explosions   = explosions  .filter(e => e.alive);
  bombers      = bombers     .filter(b => b.alive);

  // Wave clear?
  if (spawned >= missilePool &&
      missiles.length === 0 && interceptors.length === 0 &&
      explosions.length === 0 && bombers.length === 0) {
    startBonus();
    return;
  }

  // Game over?
  if (!cities.some(c => c.alive)) {
    state = 'OVER';
    sfxGameOver();
  }
}

// --- BONUS PHASE ---
function startBonus() {
  state        = 'BONUS';
  bonusPhase   = 0;   // 0=cities, 1=missiles, 2=done
  bonusTimer   = 90;
  bonusCities  = cities.filter(c => c.alive).length;
  bonusMissiles = batteries.filter(b => b.alive).reduce((s, b) => s + b.ammo, 0);
  bonusDisplay = { cities: 0, missiles: 0 };
  sfxWaveClear();
}

function updateBonus(dt) {
  bonusTimer -= dt;

  // Tick up displayed bonus values
  if (bonusPhase === 0) {
    const target = bonusCities * 100;
    if (bonusDisplay.cities < target) {
      bonusDisplay.cities = Math.min(bonusDisplay.cities + 5, target);
      addScore(5);
    }
  } else if (bonusPhase === 1) {
    const target = bonusMissiles * 5;
    if (bonusDisplay.missiles < target) {
      bonusDisplay.missiles = Math.min(bonusDisplay.missiles + 5, target);
      addScore(5);
    }
  }

  if (bonusTimer <= 0) {
    bonusTimer = 80;
    bonusPhase++;
    if (bonusPhase > 2) {
      wave++;
      initWave();
      state = 'PLAYING';
    }
  }
}

// --- DRAW HELPERS ---
function drawCity(c) {
  if (!c.alive) return;
  const x = c.x;
  const y = GROUND_Y;
  ctx.fillStyle = '#4cf';
  // Base
  ctx.fillRect(x - 16, y - 20, 32, 20);
  // Left tower
  ctx.fillRect(x - 13, y - 30, 10, 12);
  // Right tower
  ctx.fillRect(x + 3,  y - 27,  9, 10);
  // Windows
  ctx.fillStyle = '#000';
  ctx.fillRect(x - 10, y - 16, 4, 4);
  ctx.fillRect(x + 6,  y - 16, 4, 4);
  ctx.fillRect(x - 10, y - 9,  4, 4);
  ctx.fillRect(x + 6,  y - 9,  4, 4);
  // Antenna
  ctx.fillStyle = '#4cf';
  ctx.fillRect(x - 8, y - 38, 2, 10);
}

function drawBattery(b) {
  if (!b.alive) return;
  const x = b.x;
  ctx.fillStyle = '#8f8';
  // Base platform
  ctx.fillRect(x - 22, GROUND_Y - 7, 44, 7);
  // Body
  ctx.fillRect(x - 8, GROUND_Y - 18, 16, 13);
  // Barrel toward cursor
  const angle = Math.atan2(my - (GROUND_Y - 18), mx - x);
  ctx.strokeStyle = '#8f8';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, GROUND_Y - 18);
  ctx.lineTo(x + Math.cos(angle) * 20, GROUND_Y - 18 + Math.sin(angle) * 20);
  ctx.stroke();
  // Ammo dots
  for (let i = 0; i < b.ammo; i++) {
    ctx.fillStyle = i < 3 ? '#f44' : '#8f8';
    ctx.fillRect(x - 24 + i * 5, GROUND_Y - 30, 3, 8);
  }
}

function drawMissile(m) {
  if (m.trail.length < 2) return;
  ctx.strokeStyle = m.col;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(m.trail[0][0], m.trail[0][1]);
  for (const [px, py] of m.trail) ctx.lineTo(px, py);
  ctx.stroke();
  // Warhead
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(m.x, m.y, 2.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawBomber(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  if (b.vx < 0) ctx.scale(-1, 1);
  ctx.fillStyle = b.col;
  // Fuselage
  ctx.beginPath();
  ctx.moveTo(18, 0);
  ctx.lineTo(-12, -5);
  ctx.lineTo(-10, 0);
  ctx.lineTo(-12, 5);
  ctx.closePath();
  ctx.fill();
  // Wings
  ctx.fillRect(-4, -13, 12, 4);
  ctx.fillRect(-4,   9, 12, 4);
  ctx.restore();
}

function drawInterceptor(ic) {
  if (ic.trail.length < 2) return;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(ic.trail[0][0], ic.trail[0][1]);
  for (const [px, py] of ic.trail) ctx.lineTo(px, py);
  ctx.stroke();
}

function drawExplosion(ex) {
  if (ex.r <= 0) return;
  const a = ex.growing ? 0.85 : (ex.r / ex.maxR) * 0.85;
  const c = ex.player ? `rgba(255,210,60,${a})` : `rgba(255,90,20,${a})`;
  ctx.strokeStyle = c;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2);
  ctx.stroke();
  if (ex.growing) {
    ctx.fillStyle = ex.player
      ? `rgba(255,230,100,${a * 0.12})`
      : `rgba(255,110,30,${a * 0.12})`;
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawGround() {
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.strokeStyle = '#2d6a2d';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y);
  ctx.stroke();
}

function drawHUD() {
  ctx.font = 'bold 20px monospace';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText(String(score).padStart(6, '0'), 20, 30);
  ctx.textAlign = 'center';
  ctx.fillStyle = waveCol(wave);
  ctx.fillText('WAVE ' + wave, W / 2, 30);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'right';
  ctx.fillText('HI ' + String(hiScore).padStart(6, '0'), W - 20, 30);
}

function drawCrosshair() {
  const s = 10;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(mx - s, my); ctx.lineTo(mx + s, my);
  ctx.moveTo(mx, my - s); ctx.lineTo(mx, my + s);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(mx, my, 5, 0, Math.PI * 2);
  ctx.stroke();
}

// --- SCREENS ---
function drawTitle() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Flashing title
  if (Math.floor(Date.now() / 600) % 2 === 0) {
    ctx.fillStyle = '#f44';
  } else {
    ctx.fillStyle = '#f80';
  }
  ctx.font = 'bold 70px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('MISSILE', W / 2, 160);
  ctx.fillText('COMMAND', W / 2, 240);

  ctx.fillStyle = '#ff0';
  ctx.font = 'bold 18px monospace';
  ctx.fillText('HI SCORE: ' + String(hiScore).padStart(6, '0'), W / 2, 310);

  ctx.fillStyle = Math.floor(Date.now() / 500) % 2 === 0 ? '#fff' : '#aaa';
  ctx.font = '18px monospace';
  ctx.fillText('— CLICK TO START —', W / 2, 380);

  ctx.fillStyle = '#666';
  ctx.font = '14px monospace';
  ctx.fillText('LEFT CLICK  = LEFT BATTERY', W / 2, 440);
  ctx.fillText('MIDDLE CLICK = CENTER BATTERY', W / 2, 462);
  ctx.fillText('RIGHT CLICK = RIGHT BATTERY', W / 2, 484);
  ctx.fillText('DEFEND YOUR CITIES', W / 2, 524);
}

function drawBonus() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  drawGround();
  cities.forEach(drawCity);
  batteries.forEach(drawBattery);
  drawHUD();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff0';
  ctx.font = 'bold 30px monospace';
  ctx.fillText('WAVE ' + wave + ' COMPLETE!', W / 2, 180);

  ctx.font = '22px monospace';
  ctx.fillStyle = '#0ff';
  ctx.fillText('BONUS POINTS', W / 2, 250);

  ctx.fillStyle = '#fff';
  ctx.font = '20px monospace';
  ctx.fillText(
    'CITIES   ' + bonusCities + ' × 100 = ' + bonusDisplay.cities,
    W / 2, 300
  );
  ctx.fillText(
    'MISSILES ' + bonusMissiles + ' × 5 = ' + bonusDisplay.missiles,
    W / 2, 335
  );

  if (bonusPhase >= 2) {
    ctx.fillStyle = waveCol(wave + 1);
    ctx.font = 'bold 20px monospace';
    ctx.fillText('PREPARE FOR WAVE ' + (wave + 1) + '...', W / 2, 410);
  }
}

function drawGameOver() {
  // Darken
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#f44';
  ctx.font = 'bold 46px monospace';
  ctx.fillText('THE MISSILES WIN', W / 2, 220);

  ctx.fillStyle = '#fff';
  ctx.font = '24px monospace';
  ctx.fillText('SCORE: ' + String(score).padStart(6, '0'), W / 2, 300);
  ctx.fillText('BEST:  ' + String(hiScore).padStart(6, '0'), W / 2, 340);

  ctx.fillStyle = Math.floor(Date.now() / 500) % 2 === 0 ? '#ff0' : '#f80';
  ctx.font = '20px monospace';
  ctx.fillText('— CLICK TO PLAY AGAIN —', W / 2, 420);
}

// --- MAIN DRAW ---
function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  if (state === 'TITLE') { drawTitle(); return; }
  if (state === 'BONUS') { drawBonus(); return; }

  drawGround();
  missiles    .forEach(drawMissile);
  bombers     .forEach(drawBomber);
  interceptors.forEach(drawInterceptor);
  explosions  .forEach(drawExplosion);
  cities      .forEach(drawCity);
  batteries   .forEach(drawBattery);
  drawHUD();
  drawCrosshair();

  if (state === 'OVER') drawGameOver();
}

// --- GAME LOOP ---
let lastTs = 0;
function loop(ts) {
  const raw = ts - lastTs;
  lastTs = ts;
  const dt = Math.min(raw / 16.667, 3); // normalize to 60fps, cap at 3×
  if (state === 'PLAYING') update(dt);
  else if (state === 'BONUS') updateBonus(dt);
  draw();
  requestAnimationFrame(loop);
}

// --- INPUT ---
function scalePos(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (W / r.width),
    y: (e.clientY - r.top)  * (H / r.height)
  };
}

canvas.addEventListener('mousemove', e => {
  const p = scalePos(e);
  mx = p.x; my = p.y;
});

canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  AC.resume();

  if (state === 'TITLE' || state === 'OVER') {
    initGame();
    state = 'PLAYING';
    return;
  }
  if (state !== 'PLAYING') return;

  // Map button → battery index
  const bi = e.button === 0 ? 0 : e.button === 1 ? 1 : e.button === 2 ? 2 : -1;
  if (bi >= 0) {
    const p = scalePos(e);
    fire(bi, p.x, p.y);
  }
});

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('auxclick',     e => e.preventDefault()); // middle-click new tab

// --- START ---
state = 'TITLE';
requestAnimationFrame(loop);
</script>
</body>
</html>
